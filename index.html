<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracker Hub" />
  <meta name="description" content="Tracker Hub - all your tracker links in one place." />
  <title>Tracker Hub</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Loading -->
  <div id="loading" class="screen center">
    <div class="spinner" aria-label="Loading"></div>
  </div>

  <!-- Sign-in screen -->
  <main id="login-screen" class="screen center" hidden>
    <div class="login-card">
      <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1>Tracker Hub</h1>
      <p class="muted">All your tracker links, in one place.</p>
      <button id="login-btn" class="btn btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6C12.3 13.5 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/>
          <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.7l7.8-6z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4-13.6-9.8l-7.8 6C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <p id="login-status" class="status" role="alert" hidden></p>
    </div>
  </main>

  <!-- Main app -->
  <div id="app-screen" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="logo logo-sm" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <span class="brand-name">Tracker Hub</span>
      </div>
      <div class="user">
        <span id="user-name" class="user-name"></span>
        <button id="install-btn" class="btn btn-primary btn-small" type="button" hidden>Install</button>
        <button id="signout-btn" class="btn btn-ghost" type="button">Sign out</button>
      </div>
    </header>

    <section class="add-section">
      <form id="add-form" class="add-form" autocomplete="off">
        <input id="url-input" class="input" type="text" inputmode="url" placeholder="Search, or paste a website to add it" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button id="add-btn" class="btn btn-primary" type="submit">Add</button>
      </form>
      <p id="status" class="status" role="alert" hidden></p>
    </section>

    <main class="content">
      <div class="list-bar">
        <div class="view-toggle" role="group" aria-label="Choose what to show">
          <button id="view-checklist" class="view-btn" type="button" aria-pressed="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l2 2 3-3"/><path d="M3 14l2 2 3-3"/><path d="M12 6h9"/><path d="M12 14h9"/></svg>
            Checklist
          </button>
          <button id="view-links" class="view-btn" type="button" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
            Links
          </button>
        </div>
        <div class="list-actions">
          <button id="cancel-btn" class="btn btn-ghost" type="button" hidden>Cancel</button>
          <button id="edit-btn" class="btn btn-ghost" type="button" aria-pressed="false"><span class="btn-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span><span class="btn-label">Edit</span></button>
        </div>
      </div>
      <div id="list" class="list"></div>
      <p id="empty" class="empty muted" hidden>No links yet. Add your first tracker above.</p>
    </main>
  </div>

  <!-- Edit a link: title, address and logo -->
  <dialog id="edit-dialog" class="edit-dialog" aria-labelledby="edit-heading">
    <form id="edit-form" class="edit-form" autocomplete="off">
      <h3 id="edit-heading">Edit link</h3>

      <label class="field">
        <span>Title</span>
        <input id="edit-title" class="input" type="text" maxlength="120" placeholder="Automatic from the address" />
      </label>

      <label class="field">
        <span>Website address</span>
        <input id="edit-url" class="input" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" required />
      </label>

      <div class="logo-field">
        <span id="edit-logo-preview" class="card-logo logo-preview" aria-hidden="true"><img id="edit-logo-img" alt="" referrerpolicy="no-referrer" /></span>
        <label class="field grow">
          <span>Logo image address</span>
          <input id="edit-logo" class="input" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Automatic from the website" />
        </label>
      </div>

      <p class="hint muted">Leave the title or logo empty to use the automatic one.</p>
      <p id="edit-status" class="status" role="alert" hidden></p>

      <div class="edit-actions">
        <button id="edit-cancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="edit-save" class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
